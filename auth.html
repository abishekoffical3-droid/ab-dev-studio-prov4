<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="AB Dev Studio account login and signup"><title>Account | AB Dev Studio</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="auth.css"></head><body class="account-page"><main class="account-shell"><a class="account-brand" href="index.html">AB<span>.</span></a><section class="auth-card"><div class="auth-heading"><span class="section-tag">AB DEV STUDIO</span><h1 id="authTitle">Welcome back</h1><p id="authSubtitle">Sign in to access your dashboard and your one free service.</p></div><form id="authForm"><div id="nameField" class="field hidden"><label for="name">Name</label><input id="name" autocomplete="name" placeholder="Your name"></div><div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" minlength="6" required placeholder="Minimum 6 characters"></div><button class="btn btn-primary auth-submit" type="submit"><span id="submitText">Login</span><i class="fa-solid fa-arrow-right"></i></button><p id="authMessage" class="auth-message" role="status"></p></form><button id="toggleAuth" class="switch-auth" type="button">New here? Create an account</button><a class="back-home" href="index.html">← Back to website</a></section></main><script src="auth.js"></script></body></html>
